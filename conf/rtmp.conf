# SRS 基础 RTMP 配置
#
# 容器方式：直接跑镜像默认 docker.conf 即可（已含 HLS/FLV/RTC），无需本文件。
# 源码方式启动：./objs/srs -c conf/rtmp.conf
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
http_api {
    enabled         on;
    listen          1985;
}
vhost __defaultVhost__ {
    # HTTP-FLV：http://host:8080/live/livestream.flv
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    # HLS：http://host:8080/live/livestream.m3u8
    hls {
        enabled     on;
    }
}
