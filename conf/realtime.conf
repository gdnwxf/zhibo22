# SRS 低延迟配置（第 4 节第 4 条：开启 tcp_nodelay，延迟压到几百 ms）
#
# 该文件可直接覆盖容器默认配置：
#   LOW_LATENCY=1 ./scripts/start_srs.sh
# 或源码方式：
#   ./objs/srs -c conf/realtime.conf
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
http_api {
    enabled         on;
    listen          1985;
}
rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
}
vhost __defaultVhost__ {
    # RTMP/HTTP-FLV 关闭 Nagle 合包，牺牲一点带宽换延迟
    tcp_nodelay     on;
    min_latency     on;

    # 保留 HLS / HTTP-FLV / WebRTC 分发能力（与镜像默认 docker.conf 一致）
    hls {
        enabled         on;
    }
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }

    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }
}
