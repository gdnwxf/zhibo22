# SRS 开启 publish 鉴权的 RTMP 配置（第 5 节）
#
# 重要：SRS 5 没有"配置里写死一个 token"的开关，官方推流鉴权走 on_publish HTTP 回调；
# 且 on_publish 必须放在 vhost → http_hooks 里（放在 publish 里会报 ConfigInvalid）。
#
# 推流地址变为：rtmp://ip/live/livestream?token=abc123
# SRS 会把带 token 的 URL 回调给鉴权服务，由服务返回 0(放行) / 非 0(拒绝)。
#
# 启动顺序：
#   1) 先起回调服务：python3 scripts/auth_server.py
#   2) 再起 SRS：
#        容器：podman run ... -v $PWD/conf/rtmp.auth.conf:/usr/local/srs/conf/docker.conf:ro ...
#        源码：./objs/srs -c conf/rtmp.auth.conf
#
# 注意：容器里回调地址不能用 127.0.0.1（那是容器自身）。
# 用 host.containers.internal 指向宿主机（Podman/Docker Desktop 均支持）。
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
http_api {
    enabled         on;
    listen          1985;
}
vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled     on;
    }
    http_hooks {
        enabled     on;
        # 回调地址指向宿主机上的 auth_server.py
        # 源码本机启动可用 127.0.0.1；容器启动必须用 host.containers.internal
        on_publish  http://host.containers.internal:8085/api/v1/publish;
    }
}
